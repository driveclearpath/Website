<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Founding List | ClearPath Automotive</title><style>:root{--navy:#0b2139;--orange:#e9683b;--cream:#f5f4ee}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font:15px Arial,sans-serif}header{background:var(--navy);padding:22px clamp(20px,6vw,80px)}header img{width:240px}.wrap{max-width:1200px;margin:auto;padding:55px 24px}h1{font:42px Georgia,serif;margin:0 0 8px}.muted{color:#647582}.access{max-width:600px;background:#fff;padding:28px;border-radius:14px;box-shadow:0 18px 45px #0b213912}.access form{display:flex;gap:10px}.access input{flex:1;padding:13px;border:1px solid #b9c3c7;border-radius:7px}.button{border:0;border-radius:7px;background:var(--orange);color:#fff;padding:13px 18px;font-weight:700;cursor:pointer}.dashboard[hidden]{display:none}.top{display:flex;align-items:end;justify-content:space-between;gap:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:32px 0}.stat{background:#fff;padding:22px;border-radius:12px}.stat b{display:block;font:36px Georgia,serif}.grid{display:grid;grid-template-columns:1fr 2fr;gap:20px}.panel{background:#fff;padding:24px;border-radius:12px;overflow:auto}.panel h2{font:25px Georgia,serif;margin-top:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e1e5e4;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.status{color:#40876e}.error{color:#a63020}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.access form,.top{align-items:stretch;flex-direction:column}}</style></head><body><header><img src="/assets/clearpath-automotive-white.png" alt="ClearPath Automotive"></header><main class="wrap"><section class="access" id="access"><h1>Founding list</h1><p class="muted">Private ClearPath reporting. Enter the dashboard access key.</p><form id="login"><input id="token" type="password" autocomplete="current-password" required aria-label="Access key"><button class="button">View dashboard</button></form><p id="error" class="error" role="alert"></p></section><section class="dashboard" id="dashboard" hidden><div class="top"><div><h1>Founding list</h1><p class="muted">Consent, confirmation, and regional interest at a glance.</p></div><button class="button" id="export">Export CSV</button></div><div class="stats" id="stats"></div><div class="grid"><div class="panel"><h2>ZIP distribution</h2><table><thead><tr><th>ZIP</th><th>People</th></tr></thead><tbody id="zips"></tbody></table></div><div class="panel"><h2>Recent signups</h2><table><thead><tr><th>Email</th><th>ZIP</th><th>Status</th><th>Joined</th></tr></thead><tbody id="recent"></tbody></table></div></div></section></main><script>
const $=s=>document.querySelector(s);let accessKey='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const response=await fetch('/api/founding-list-admin',{headers:{authorization:`Bearer ${accessKey}`}});if(!response.ok)throw new Error(response.status===401?'That access key was not accepted.':'Dashboard data could not be loaded.');const data=await response.json();$('#stats').innerHTML=Object.entries(data.summary).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join('');$('#zips').innerHTML=data.zipDistribution.map(x=>`<tr><td>${esc(x.zip)}</td><td>${x.count}</td></tr>`).join('')||'<tr><td colspan="2">No signups yet</td></tr>';$('#recent').innerHTML=data.recent.map(x=>`<tr><td>${esc(x.email)}</td><td>${esc(x.zip||'—')}</td><td class="status">${esc(x.status)}</td><td>${new Date(x.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="4">No signups yet</td></tr>';$('#access').hidden=true;$('#dashboard').hidden=false}$('#login').addEventListener('submit',async e=>{e.preventDefault();accessKey=$('#token').value;$('#error').textContent='';try{await load()}catch(err){$('#error').textContent=err.message}});$('#export').addEventListener('click',async()=>{const r=await fetch('/api/founding-list-admin?format=csv',{headers:{authorization:`Bearer ${accessKey}`}});if(!r.ok)return;const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='clearpath-founding-list.csv';a.click();URL.revokeObjectURL(a.href)});
</script></body></html>
